name: Validate iOS
on:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Xcode 27 Apple Silicon runner pool
        type: choice
        options: [xcode-27, xcode-27-xlarge]
        default: xcode-27
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          python3 scripts/check-apple-sdk.py
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Boot matching iPhone simulator
        timeout-minutes: 10
        run: |
          python3 scripts/test-select-simulator.py
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 scripts/select-simulator.py "$SDK_VERSION")
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Simulator tests
        timeout-minutes: 30
        run: |
          xcodebuild test -project myFiles.xcodeproj -scheme myFiles -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO -retry-tests-on-failure -test-iterations 2 CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult
      - name: Build Release archive for iPhone and iPad
        run: |
          xcodebuild archive -project myFiles.xcodeproj -scheme myFiles -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/myFiles-unsigned.xcarchive" CODE_SIGNING_ALLOWED=NO
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/myFiles-unsigned.xcarchive" "$RUNNER_TEMP/myFiles-unsigned.xcarchive.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-device-archive
          path: ${{ runner.temp }}/myFiles-unsigned.xcarchive.zip
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-test-results
          path: TestResults.xcresult
          retention-days: 7
