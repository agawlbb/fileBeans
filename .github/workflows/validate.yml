name: Validate iOS
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Simulator tests
        timeout-minutes: 12
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test -project myFiles.xcodeproj -scheme myFiles -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult
      - name: Build Release archive for iPhone and iPad
        run: |
          xcodebuild archive -project myFiles.xcodeproj -scheme myFiles -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/myFiles-unsigned.xcarchive" CODE_SIGNING_ALLOWED=NO
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/myFiles-unsigned.xcarchive" "$RUNNER_TEMP/myFiles-unsigned.xcarchive.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-device-archive
          path: ${{ runner.temp }}/myFiles-unsigned.xcarchive.zip
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-test-results
          path: TestResults.xcresult
          retention-days: 7
