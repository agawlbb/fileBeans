name: myFiles
options:
  bundleIdPrefix: $(BUNDLE_ID_PREFIX)
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '26.3'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
    APP_GROUP: group.$(BUNDLE_ID_PREFIX)
    KEYCHAIN_GROUP: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configFiles:
  Debug: Config/Project.xcconfig
  Release: Config/Project.xcconfig
targets:
  myFiles:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Main-App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE_UUID)
    dependencies:
      - target: QuantumFileProvider
  QuantumFileProvider:
    type: app-extension
    platform: iOS
    sources: [FileProvider, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).FileProvider
        INFOPLIST_FILE: Config/Provider-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        PROVISIONING_PROFILE_SPECIFIER: $(PROVIDER_PROFILE_UUID)
  myFilesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: myFiles
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  myFiles:
    build:
      targets:
        myFiles: all
    test:
      targets: [myFilesTests]
    archive:
      config: Release
